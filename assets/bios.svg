<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" role="img" aria-labelledby="title desc">
  <title id="title">PinkBIOS boot screen</title>
  <desc id="desc">Jenny Speelman, Staff Engineer in Developer Relations at Edge Impulse / Qualcomm. Co-author of AI at the Edge (O'Reilly). 58 talks, 40 blogs and docs.</desc>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 16px; fill: #c8c8c8; white-space: pre; }
    .hl { fill: #ffffff; }
    .ok { fill: #ff8cc6; }
    .logo { fill: #ff8cc6; font-size: 12px; }
    .l { opacity: 0; animation: show .01s forwards; }
    .cur { animation: blink 1s steps(1) 3.4s infinite; }
    @keyframes show { to { opacity: 1; } }
    @keyframes blink { 50% { fill-opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .l { animation: none; opacity: 1; } .cur { animation: none; } }
  </style>
  <rect width="880" height="400" rx="8" fill="#000"/>

  <!-- pixel chip logo (same art as the site favicon) -->
  <g transform="translate(724 26) scale(3)" shape-rendering="crispEdges">
    <path fill="#7d1747" d="M10 3h2v4h-2zM15 3h2v4h-2zM20 3h2v4h-2zM10 25h2v4h-2zM15 25h2v4h-2zM20 25h2v4h-2zM3 10h4v2H3zM3 15h4v2H3zM3 20h4v2H3zM25 10h4v2h-4zM25 15h4v2h-4zM25 20h4v2h-4z"/>
    <path fill="#000" d="M6 6h20v20H6z"/>
    <path fill="#e0115f" d="M7 7h18v18H7z"/>
    <path fill="#ff8cc6" d="M7 7h18v2H7zM7 7h2v18H7z"/>
    <path fill="#fff" d="M12 12h3v1h-3zM17 12h3v1h-3zM11 13h10v2H11zM12 15h8v1h-8zM13 16h6v1h-6zM14 17h4v1h-4zM15 18h2v1h-2z"/>
  </g>
  <text class="logo" x="772" y="140" text-anchor="middle">EDGE AI</text>
  <text class="logo" x="772" y="156" text-anchor="middle">READY</text>

  <g transform="translate(30 44)">
    <text class="l hl" y="0"   style="animation-delay:.2s">PinkBIOS v4.20, Edge AI Edition</text>
    <text class="l"    y="22"  style="animation-delay:.4s">Copyright (C) 1998-2026, Jenny Speelman</text>
    <text class="l"    y="66"  style="animation-delay:.7s">Main Processor : <tspan class="hl">Staff Engineer, Developer Relations</tspan></text>
    <text class="l"    y="88"  style="animation-delay:.9s">Motherboard    : <tspan class="hl">Edge Impulse / Qualcomm</tspan></text>
    <text class="l"    y="110" style="animation-delay:1.1s">Memory Testing : <tspan class="hl">65536K</tspan> OK</text>
    <text class="l"    y="154" style="animation-delay:1.4s">Detecting Drive 0 ... <tspan class="hl">AI_AT_THE_EDGE</tspan> (O'Reilly, 2023)</text>
    <text class="l"    y="176" style="animation-delay:1.6s">Detecting Drive 1 ... <tspan class="hl">TALKS.WMV</tspan> (58 files)</text>
    <text class="l"    y="198" style="animation-delay:1.8s">Detecting Drive 2 ... <tspan class="hl">BLOGS_AND_DOCS</tspan> (40 files)</text>
    <text class="l"    y="242" style="animation-delay:2.2s">Loading TinyML kernel ............ <tspan class="ok">OK</tspan></text>
    <text class="l"    y="264" style="animation-delay:2.5s">Quantizing personality to int8 ... <tspan class="ok">OK</tspan></text>
    <text class="l"    y="286" style="animation-delay:2.8s">Calibrating sparkles ............. <tspan class="ok">OK</tspan></text>
    <text class="l"    y="330" style="animation-delay:3.2s">Booting <tspan class="hl">jennyspeelman.me</tspan><tspan class="cur">_</tspan></text>
  </g>
</svg>
